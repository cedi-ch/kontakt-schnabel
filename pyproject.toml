[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kontakt-schnabel"
version = "0.1.0"
description = "CLI tool for merging, deduplicating, and sanitizing vCard files"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "phonenumbers>=8.13",
    "Pillow>=10.0",
    "imagehash>=4.3",
    "chardet>=5.0",
    "jellyfish>=1.0",
    "Unidecode>=1.3",
    "vobject>=0.9.8",
    "readchar>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
schnabel = "schnabel.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
